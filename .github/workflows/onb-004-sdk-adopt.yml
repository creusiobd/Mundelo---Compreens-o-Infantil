name: ONB-004 Adopt Verified SDK Manifests
on:
  push:
    branches: [feat/onb-004-sdk-adopt]
    paths: ['.github/workflows/onb-004-sdk-adopt.yml']
permissions:
  contents: read
  actions: read
jobs:
  adopt:
    if: github.repository == 'creusiobd/Mundelo---Compreens-o-Infantil' && github.ref == 'refs/heads/feat/onb-004-sdk-adopt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve exact approved artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45894257978 --jq '.conclusion' | grep -qx success
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15153007544/zip > "$RUNNER_TEMP/sdk.zip"
          printf '%s  %s\n' af3f20f244fccde26fa3e45fd4060b27364be8736a4ac39fe8f66f80fc07875d "$RUNNER_TEMP/sdk.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib, os, hashlib, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'sdk.zip') as z:
              assert sorted(z.namelist())==sorted(['package.json','package-lock.json','SHA256SUMS','provenance.txt'])
              assert z.read('provenance.txt').decode().splitlines()==['commit=c989cb0385689f15c9888d4b77950554b5f88ca6','sdk=2.119.2']
              expected={'package.json':'2c269d171065c109eb713f7e71725bcce099ea93c6985c8bbf0e4e53e580fe8d','package-lock.json':'8469232f0d55cb9d6aff440bfb1f9a88b8138d0c1217df791fa5f63e4027ec2d'}
              for name,digest in expected.items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest
              current=json.loads(pathlib.Path('package.json').read_text())
              candidate=json.loads(z.read('package.json'))
              assert '@supabase/supabase-js' not in current['dependencies']
              current['dependencies']['@supabase/supabase-js']='2.119.2'
              assert current==candidate
              for name in expected:
                  pathlib.Path(name).write_bytes(z.read(name))
          PY
      - name: Commit only the verified manifests to the dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json
          test "$(git diff --cached --name-only | sort)" = "$(printf 'package-lock.json\npackage.json')"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build(onb): adopt verified Supabase SDK manifests (#87)"
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/onb-004-sdk-adopt
