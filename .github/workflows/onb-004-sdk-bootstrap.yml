name: ONB-004 SDK Bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/onb-004-sdk-bootstrap.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDK_VERSION: '2.119.2'
      npm_config_registry: https://registry.npmjs.org/
      npm_config_fetch_retries: '2'
      CI: 'true'
      VITE_APP_ENV: test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registry connectivity and release metadata
        run: |
          set -euo pipefail
          node --version
          npm --version
          getent ahosts registry.npmjs.org >/dev/null
          npm ping
          npm view "@supabase/supabase-js@$SDK_VERSION" version engines dist.integrity --json
          test "$(npm view "@supabase/supabase-js@$SDK_VERSION" version)" = "$SDK_VERSION"
      - name: Generate candidate manifests without running lifecycle scripts
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/onb-sdk-baseline-lock.json"
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund "@supabase/supabase-js@$SDK_VERSION"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const v=process.env.SDK_VERSION;
          assert.equal(p.dependencies['@supabase/supabase-js'],v);
          assert.equal(l.packages[''].dependencies['@supabase/supabase-js'],v);
          assert.equal(l.packages['node_modules/@supabase/supabase-js'].version,v);
          const baseline=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/onb-sdk-baseline-lock.json','utf8'));
          const parent='node_modules/@tailwindcss/oxide-wasm32-wasi';
          const trusted=item=>{
            if(!item||typeof item.resolved!=='string'||typeof item.integrity!=='string')return false;
            const u=new URL(item.resolved);
            return u.origin==='https://registry.npmjs.org'&&!u.username&&!u.password&&!u.hash&&/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(item.integrity);
          };
          const validate=(name,item,packages)=>{
            if(item.inBundle===true){
              assert.ok(name.startsWith(parent+'/node_modules/'),'Unapproved bundle: '+name);
              assert.deepEqual(item,baseline.packages[name],'Bundled entry changed: '+name);
              assert.ok(trusted(packages[parent]),'Untrusted parent tarball: '+parent);
              assert.deepEqual(packages[parent],baseline.packages[parent],'Bundle parent changed');
              assert.ok(item.resolved===undefined&&item.integrity===undefined,'Unexpected bundled origin: '+name);
              return 'bundled';
            }
            assert.ok(trusted(item),'Untrusted registry or missing integrity: '+name);
            return 'registry';
          };
          let bundled=0;
          for(const [name,item] of Object.entries(l.packages)){
            if(name==='')continue;
            if(validate(name,item,l.packages)==='bundled')bundled++;
          }
          // Negative controls: no arbitrary bundle exemption or alternate registry.
          assert.throws(()=>validate('node_modules/fake',{inBundle:true},l.packages));
          assert.throws(()=>validate('node_modules/fake',{resolved:'https://evil.invalid/package.tgz',integrity:'sha512-AAAA'},l.packages));
          assert.throws(()=>validate('node_modules/fake',{resolved:'https://registry.npmjs.org/package.tgz'},l.packages));
          for(const [name,item] of Object.entries(baseline.packages)){
            if(item.inBundle!==true)continue;
            assert.deepEqual(l.packages[name],item,'Baseline bundle removed or changed: '+name);
            assert.throws(()=>validate(name,{...item,version:'0.0.0'},l.packages));
            assert.throws(()=>validate(name,item,{...l.packages,[parent]:{...l.packages[parent],integrity:'sha512-AAAA'}}));
          }
          console.log('Verified unchanged bundled entries: '+bundled);
          JS
          git diff --stat -- package.json package-lock.json
      - name: Audit candidate before installation
        run: npm audit --audit-level=high
      - name: Clean reproducible installation
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify SDK import and installed dependency
        run: |
          npm ls @supabase/supabase-js
          node --input-type=module -e "import {createClient} from '@supabase/supabase-js'; if(typeof createClient !== 'function') process.exit(1)"
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Credential scan and unit regression
        run: |
          node scripts/check-exposed-credentials.mjs
          npm test
      - name: TypeScript and production build
        run: |
          npm run lint
          npm run build
      - name: Browser regression and accessibility
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
          npm run test:a11y
      - name: Prepare validated candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/onb-sdk-candidate"
          cp package.json package-lock.json "$RUNNER_TEMP/onb-sdk-candidate/"
          cd "$RUNNER_TEMP/onb-sdk-candidate"
          sha256sum package.json package-lock.json > SHA256SUMS
          printf 'commit=%s\nsdk=%s\n' "$GITHUB_SHA" "$SDK_VERSION" > provenance.txt
      - name: Upload validated manifests
        uses: actions/upload-artifact@v4
        with:
          name: onb-sdk-validated-manifests
          path: ${{ runner.temp }}/onb-sdk-candidate/
          if-no-files-found: error
          retention-days: 7
