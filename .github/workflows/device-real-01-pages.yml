name: MUNDELO | DEVICE-REAL-01 demo HTTPS

# Deliberately manual: this deployment publishes a publicly accessible static demo.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mundelo-device-real-01-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify domain, types, browser flows and accessibility
        run: |
          npm test
          npm run lint
          npm run test:e2e
          npm run test:a11y
      - name: Build static demo for GitHub Pages subpath
        run: npm run build -- --base=/Mundelo---Compreens-o-Infantil/
      - name: Ask crawlers not to index the demonstrator
        run: |
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const p='dist/index.html'; const s=readFileSync(p,'utf8'); if(!s.includes('</head>')) throw new Error('Missing head element'); writeFileSync(p,s.replace('</head>','<meta name=\"robots\" content=\"noindex,nofollow,noarchive\" /></head>'));"
      - name: Verify no DEV security lab chunk is present
        run: |
          if find dist -type f -iname '*SecurityLab*' | grep -q .; then
            echo 'Unexpected security lab asset in production build' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
